# Source of truth for the Xcode project: `xcodegen generate`.
#
# An Xcode project is required rather than plain SwiftPM because SwiftPM's CLI
# cannot compile MLX's Metal shaders — but a checked-in .xcodeproj is unreadable
# and unmergeable, so it is generated from this file instead.
name: Offprint
options:
  bundleIdPrefix: de.boostnow
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # Swift 6.2 "approachable concurrency": everything is MainActor unless it
    # opts out, which removes most annotation noise from UI code.
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ARCHS: arm64

packages:
  OffprintCore:
    path: .
  # MLX lives only in the Xcode project, never in Package.swift: adding it there
  # would make `swift build` try to compile Metal shaders, which SwiftPM's CLI
  # cannot do, and would cost the fast `swift test` loop its speed.
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    majorVersion: 3.31.4
  # `#hubDownloader()` expands to code referencing HubClient, and mlx-swift-lm
  # does not depend on swift-huggingface itself, so the consumer supplies it.
  swift-huggingface:
    url: https://github.com/huggingface/swift-huggingface
    minVersion: 0.10.0
    maxVersion: 1.0.0
  # `#huggingFaceTokenizerLoader()` expands to `Tokenizers.AutoTokenizer`, which
  # lives in swift-transformers rather than swift-huggingface.
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    majorVersion: 1.3.4

targets:
  Offprint:
    type: application
    platform: macOS
    sources:
      - path: Sources/OffprintApp
      - path: Sources/OffprintML
    dependencies:
      - package: OffprintCore
        product: OffprintCore
      - package: mlx-swift-lm
        product: MLXVLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: mlx-swift-lm
        product: MLXHuggingFace
      - package: swift-huggingface
        product: HuggingFace
      - package: swift-transformers
        product: Tokenizers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.boostnow.Offprint
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The bundle is named for what it does, so Spotlight finds it by "pdf"
        # or "markdown". The menu bar uses the short CFBundleName instead, and
        # the executable keeps a lowercase name so the CLI and MCP invocations
        # are not a quoted mouthful.
        PRODUCT_NAME: Offprint PDF to Markdown
        EXECUTABLE_NAME: offprint
        INFOPLIST_FILE: Sources/OffprintApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/OffprintApp/Offprint.entitlements
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
